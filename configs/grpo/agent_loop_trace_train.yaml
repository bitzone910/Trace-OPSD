- name: trace_opsd_agent
  _target_: trace_opsd.grpo.agent_loop.TraceOPSDAgentLoop
  tool_base_url: ${oc.env:TRACE_OPSD_TOOL_BASE_URL,http://127.0.0.1:8002}
  max_tool_calls: 5
  max_consecutive_invalid_actions: 2
  max_tokens_per_turn: 1024
  max_observation_tokens: 512
  tool_micro_batch_size: 128
  tool_micro_batch_wait_seconds: 0.01
  tool_request_concurrency: 16
  tool_timeout_seconds: 30.0
  tool_max_retries: 2
  tool_retry_backoff_seconds: 1.0
